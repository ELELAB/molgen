site_name: molgen
repo_url: https://github.com/Markussorensen/molgen
site_url: https://Markussorensen.github.io/molgen
site_description: Molgen is a project which aims to utilize the latest advancements in the field of generative deep learning, to create a deep learning model capable of generating molecules that meet specific attributes and conditions
site_author: Markus Sørensen
edit_uri: edit/main/docs/
repo_name: Markussorensen/molgen
copyright: Maintained by <a href="https://Markussorensen.com">Markus</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
            setup_commands:
                - import sys
                - sys.path.append('../')
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Markussorensen/molgen
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/molgen

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true